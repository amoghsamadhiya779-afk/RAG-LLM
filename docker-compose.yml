version: "3.8"

services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devboard
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
